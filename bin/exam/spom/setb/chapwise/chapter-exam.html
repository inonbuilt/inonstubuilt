<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set B Chapter-Wise SPOM Practice | Calcium Notes</title>
    <link rel="stylesheet" href="./exam.css">
    <link rel="icon" href="../../../../fevicol.png" type="image/png">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YYJ8R39EXM"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-YYJ8R39EXM');
    </script>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7657462226177124" crossorigin="anonymous"></script>
</head>
<body>

    <div class="header" id="examHeader">
        Calcium Notes - Premium Chapter Practice (Set B)
    </div>

    <div class="container" id="examArea">
        <div class="left card">
            <div class="case-box" id="caseBox"></div>

            <h4 id="questionNumber"></h4>

            <h3 id="questionText"></h3>
            <div id="options"></div>

            <div class="btn-area">
                <button class="primary" id="prevBtn" onclick="prevQuestion()">Previous</button>
                <button class="primary" id="nextBtn" onclick="nextQuestion()">Next</button>
                <button class="warning" id="reviewBtn" onclick="toggleReview()">Mark for Review</button>
                <button class="success" onclick="submitExam()">Submit</button>
            </div>
        </div>

        <div class="right card">
            <h3>Questions</h3>
            <div id="questionGrid" class="q-grid"></div>
        </div>
    </div>

    <div id="resultArea" style="display:none;"></div>

    <!-- ⚠️ Load Set B Question Banks here -->
    <script src="../questionsetbAI.js"></script> 
    <script src="../quessetb.js"></script> 
    <!-- ⚠️ Load the Engine here -->
    <script src="./examset.js"></script>

</body>
</html>
