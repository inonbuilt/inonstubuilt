    <script>
        // ==========================================
        // 1. PROCEDURAL REALISTIC AUDIO ENGINE (Web Audio API)
        // ==========================================
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.lastClatterTime = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.init();
                this.muted = !this.muted;
                return !this.muted;
            }

            playWhoosh(intensity = 1.0) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const bufferSize = Math.floor(this.ctx.sampleRate * 0.14);
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                const baseFreq = 400 * Math.min(Math.max(intensity, 0.7), 2.5);
                filter.frequency.setValueAtTime(baseFreq, now);
                filter.frequency.exponentialRampToValueAtTime(baseFreq * 2.8, now + 0.06);
                filter.frequency.exponentialRampToValueAtTime(250, now + 0.14);
                filter.Q.value = 2.8;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.16 * Math.min(intensity, 2.0), now + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }

            playThwack(power = 1.0, isSweetSpot = false) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const p = Math.min(Math.max(power, 0.5), 2.5);

                // Body thump (triangle)
                const osc = this.ctx.createOscillator();
                const oscGain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(isSweetSpot ? 420 : 330, now);
                osc.frequency.exponentialRampToValueAtTime(70, now + 0.09);

                oscGain.gain.setValueAtTime(0.45 * p, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

                osc.connect(oscGain);
                oscGain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);

                // Acoustic wood crack transient
                const bufferSize = Math.floor(this.ctx.sampleRate * 0.04);
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const nFilter = this.ctx.createBiquadFilter();
                nFilter.type = 'bandpass';
                nFilter.frequency.value = isSweetSpot ? 3000 : 2100;
                nFilter.Q.value = 2.4;

                const nGain = this.ctx.createGain();
                nGain.gain.setValueAtTime(0.4 * p, now);
                nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

                noise.connect(nFilter);
                nFilter.connect(nGain);
                nGain.connect(this.ctx.destination);
                noise.start(now);
            }

            playCrack(severity = 1) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(severity === 1 ? 1900 : 1300, now);
                osc.frequency.exponentialRampToValueAtTime(260, now + 0.07);

                gain.gain.setValueAtTime(0.24, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            playShatter() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;

                // Deep explosion sub-thud
                const sub = this.ctx.createOscillator();
                const subGain = this.ctx.createGain();
                sub.type = 'sine';
                sub.frequency.setValueAtTime(150, now);
                sub.frequency.exponentialRampToValueAtTime(32, now + 0.2);
                subGain.gain.setValueAtTime(0.55, now);
                subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                sub.connect(subGain);
                subGain.connect(this.ctx.destination);
                sub.start(now);
                sub.stop(now + 0.23);

                // Crashing debris burst
                const bufferSize = Math.floor(this.ctx.sampleRate * 0.18);
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.38));
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(3400, now);
                filter.frequency.exponentialRampToValueAtTime(350, now + 0.18);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.42, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }

            playClatter(speed) {
                if (this.muted) return;
                const nowMs = Date.now();
                if (nowMs - this.lastClatterTime < 65) return; // Throttle clatter
                this.lastClatterTime = nowMs;

                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const intensity = Math.min(Math.max((speed - 3) / 10, 0.08), 0.8);
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(280 + Math.random() * 90, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.05);

                gain.gain.setValueAtTime(0.18 * intensity, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            }
        }

        // ==========================================
        // 3. DIRECTIONAL BAT PHYSICS & SWEET-SPOT HIT
        // ==========================================
        function executeBatSwing(targetX, targetY, isTouch = false) {
            batUI.classList.add('swinging'); 
            setTimeout(() => { batUI.classList.remove('swinging'); }, 140);
            
            const isMobile = window.innerWidth <= 768;
            const sizeSetting = parseFloat(document.getElementById('set-size').value || 1);
            const swingRadius = (isMobile ? 125 : 155) * sizeSetting; 
            let hitSomething = false;

            // Audio whoosh tied to pointer speed
            const pointerSpeed = Math.sqrt(pointerVx * pointerVx + pointerVy * pointerVy);
            sound.playWhoosh(Math.max(1.0, pointerSpeed * 0.8));

            if (isTouch) {
                triggerTouchSpark(targetX, targetY);
            }

            activeBlocks.forEach(blockData => {
                if (blockData.body.isDestroyed) return; 
                const bx = blockData.body.position.x;
                const by = blockData.body.position.y;
                const dx = bx - targetX; 
                const dy = by - targetY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < swingRadius) {
                    hitSomething = true; 
                    blockData.body.isSpawnProtected = false; 

                    // Sweet spot calculation (center of bat blade)
                    const sweetSpotDist = Math.abs(distance - (swingRadius * 0.65));
                    const isSweetSpot = sweetSpotDist < 35;
                    const powerMult = parseFloat(document.getElementById('set-pow').value || 1);

                    // Wooden thwack sound!
                    sound.playThwack(powerMult, isSweetSpot);

                    // Apply damage
                    applyDamage(blockData, dx, dy, powerMult);
                    
                    if (!blockData.body.isDestroyed) {
                        // Elastic Squash on impact
                        triggerBlockSquash(blockData);

                        Body.setVelocity(blockData.body, { 
                            x: blockData.body.velocity.x * 0.1, 
                            y: blockData.body.velocity.y * 0.1 
                        });

                        // Calculate combined launch force from pointer velocity + base power
                        const hitForce = (isMobile ? 1.1 : 0.95) * powerMult * (isSweetSpot ? 1.35 : 1.0);
                        const safeDist = Math.max(distance, 1);
                        
                        // Blend directional impulse with swing motion vector
                        const normDx = dx / safeDist;
                        const normDy = dy / safeDist;
                        const launchVx = normDx * hitForce + (pointerVx * 0.05);
                        const launchVy = normDy * hitForce + (pointerVy * 0.05) - (isSweetSpot ? 0.3 : 0);

                        Body.applyForce(blockData.body, blockData.body.position, { 
                            x: launchVx, 
                            y: launchVy 
                        });
                        
                        // Impart spin based on edge vs sweetspot
                        const spin = (isSweetSpot ? 0.8 : 2.5) * (Math.random() - 0.5);
                        Body.setAngularVelocity(blockData.body, spin);
                    }
                }
            });

            if (hitSomething) {
                triggerDirectionalShake(pointerVx || 1, pointerVy || 1, 8);
                triggerHaptic(isTouch ? 35 : 20);
            }
        }

        function triggerBlockSquash(blockData) {
            blockData.squashTimer = 6; // 6 frames of deformation
        }

        // ==========================================
        // 5. PROGRESSIVE DAMAGE & SHATTER MECHANICS
        // ==========================================
        function applyDamage(blockData, hitDx = 0, hitDy = 0, hitPower = 1.0) {
            if (blockData.body.isDestroyed) return;
            blockData.body.hitsRemaining -= 1;
            
            // Impact Flash
            blockData.element.classList.remove('hit-flash'); 
            void blockData.element.offsetWidth; 
            blockData.element.classList.add('hit-flash');
            setTimeout(() => { if (blockData.element) blockData.element.classList.remove('hit-flash'); }, 130);

            if (blockData.body.hitsRemaining === 2) { 
                sound.playCrack(1);
                blockData.element.classList.add('hit-1'); 
            } else if (blockData.body.hitsRemaining === 1) { 
                sound.playCrack(2);
                blockData.element.classList.add('hit-2'); 
            } else if (blockData.body.hitsRemaining <= 0) { 
                shatterIntoShardsAndPowder(blockData, hitDx, hitDy, hitPower); 
            }
        }

        function shatterIntoShardsAndPowder(blockData, hitDx = 0, hitDy = 0, hitPower = 1.0) {
            const parentBody = blockData.body;
            const px = parentBody.position.x;
            const py = parentBody.position.y;
            const pw = blockData.width;
            const ph = blockData.height;
            const baseColor = blockData.baseColor;
            const pvx = parentBody.velocity.x;
            const pvy = parentBody.velocity.y;

            parentBody.isDestroyed = true;
            World.remove(world, parentBody);
            blockData.element.remove();

            const idx = activeBlocks.findIndex(b => b.body === parentBody);
            if (idx > -1) activeBlocks.splice(idx, 1);

            sound.playShatter();

            // Spawn 4 to 6 physical rigid-body shards
            const isMobile = window.innerWidth <= 768;
            const shardCount = isMobile ? 4 : 5;
            
            const clipPolygons = [
                'polygon(0% 0%, 100% 0%, 65% 100%, 0% 70%)',
                'polygon(35% 0%, 100% 25%, 100% 100%, 15% 85%)',
                'polygon(0% 25%, 85% 0%, 100% 90%, 20% 100%)',
                'polygon(15% 0%, 95% 15%, 75% 100%, 0% 85%)',
                'polygon(0% 0%, 100% 35%, 80% 100%, 15% 75%)'
            ];

            for (let i = 0; i < shardCount; i++) {
                const sw = (pw / 2.3) * (0.8 + Math.random() * 0.4);
                const sh = (ph / 2.2) * (0.8 + Math.random() * 0.4);
                const offsetX = (Math.random() - 0.5) * (pw * 0.6);
                const offsetY = (Math.random() - 0.5) * (ph * 0.6);
                
                const shardBody = Bodies.rectangle(px + offsetX, py + offsetY, sw, sh, {
                    restitution: 0.5,
                    friction: 0.4,
                    density: 0.035,
                    label: 'shard'
                });

                const burstAngle = (i / shardCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
                const burstSpeed = 4 + Math.random() * 6 + (hitPower * 2.5);
                
                Body.setVelocity(shardBody, {
                    x: pvx * 0.4 + Math.cos(burstAngle) * burstSpeed,
                    y: pvy * 0.4 + Math.sin(burstAngle) * burstSpeed - 2.5
                });
                Body.setAngularVelocity(shardBody, (Math.random() - 0.5) * 3.5);

                const shardEl = document.createElement('div');
                shardEl.className = 'shard-piece';
                shardEl.style.width = sw + 'px';
                shardEl.style.height = sh + 'px';
                shardEl.style.background = `linear-gradient(${120 + i * 40}deg, ${baseColor}, #111)`;
                shardEl.style.clipPath = clipPolygons[i % clipPolygons.length];
                shardEl.style.border = '1px solid rgba(255,255,255,0.35)';
                
                gameContainer.appendChild(shardEl);
                physicalShards.push({ body: shardBody, element: shardEl, width: sw, height: sh });
                World.add(world, shardBody);

                // Fade and remove shard after 1.5 - 2.4 seconds
                setTimeout(() => {
                    shardEl.style.transition = 'opacity 0.6s ease-out';
                    shardEl.style.opacity = '0';
                    setTimeout(() => {
                        World.remove(world, shardBody);
                        if (shardEl.parentElement) shardEl.remove();
                        const sIdx = physicalShards.findIndex(s => s.body === shardBody);
                        if (sIdx > -1) physicalShards.splice(sIdx, 1);
                    }, 600);
                }, 1500 + Math.random() * 800);
            }

            // Spawn fine powder burst
            spawnPowderParticles(px, py, pw, ph, baseColor, isMobile ? 22 : 36);

            // Ground dust puff if shattered near floor
            if (py > containerHeight - 180) {
                spawnFloorDust(px, containerHeight - 25);
            }
        }

        function spawnPowderParticles(px, py, pw, ph, baseColor, count) {
            for (let i = 0; i < count; i++) {
                const size = 3 + Math.random() * 5; 
                const piece = Bodies.circle(
                    px + (Math.random() - 0.5) * pw * 0.8, 
                    py + (Math.random() - 0.5) * ph * 0.8, 
                    size / 2, 
                    { restitution: 0.1, friction: 0.1, density: 0.001, isSensor: true }
                );

                Body.applyForce(piece, piece.position, { 
                    x: (Math.random() - 0.5) * 0.016, 
                    y: (Math.random() - 0.5) * 0.016 
                });
                
                const pieceEl = document.createElement('div'); 
                pieceEl.classList.add('powder'); 
                pieceEl.style.width = size + 'px'; 
                pieceEl.style.height = size + 'px';
                pieceEl.style.backgroundColor = baseColor;
                pieceEl.style.filter = `brightness(${0.6 + Math.random() * 0.9})`; 
                
                gameContainer.appendChild(pieceEl); 
                debrisBlocks.push({ body: piece, element: pieceEl, width: size, height: size }); 
                World.add(world, piece);

                setTimeout(() => { 
                    pieceEl.style.opacity = '0'; 
                    setTimeout(() => { 
                        World.remove(world, piece); 
                        if(pieceEl.parentElement) pieceEl.remove(); 
                        const dIndex = debrisBlocks.findIndex(d => d.body === piece);
                        if (dIndex > -1) debrisBlocks.splice(dIndex, 1);
                    }, 800); 
                }, 700 + Math.random() * 500);
            }
        }

        function spawnFloorDust(x, y) {
            for (let i = 0; i < 4; i++) {
                const dust = document.createElement('div');

        // ==========================================
        // 6. COLLISION PHYSICS & AUDIO TRIGGERS
        // ==========================================
        Events.on(engine, 'collisionStart', function(event) {
            const pairs = event.pairs; const now = Date.now();
            for (let i = 0; i < pairs.length; i++) {
                const bodyA = pairs[i].bodyA; const bodyB = pairs[i].bodyB;

                // Block-on-Block collision in Hand Mode or physics bounce
                if (bodyA.label === 'subject' && bodyB.label === 'subject') {
                    const impactSpeed = Math.sqrt(Math.pow(bodyA.velocity.x - bodyB.velocity.x, 2) + Math.pow(bodyA.velocity.y - bodyB.velocity.y, 2));
                    
                    if (impactSpeed > 2.5) {
                        sound.playClatter(impactSpeed);
                    }

                    if (currentMode === 'hand' && impactSpeed > 4.5 && !bodyA.isSpawnProtected && !bodyB.isSpawnProtected) {
                        const blockAData = activeBlocks.find(b => b.body === bodyA); 
                        const blockBData = activeBlocks.find(b => b.body === bodyB);
                        if (blockAData && now - bodyA.lastHitTime > 280) { applyDamage(blockAData); bodyA.lastHitTime = now; }
                        if (blockBData && now - bodyB.lastHitTime > 280) { applyDamage(blockBData); bodyB.lastHitTime = now; }
                        triggerDirectionalShake(0, 1, 5);
                        triggerHaptic(15);
                    }
                }

                // Block hitting Floor or Wall border
                if ((bodyA.label === 'subject' && bodyB.label === 'border') || (bodyB.label === 'subject' && bodyA.label === 'border')) {
                    const subject = bodyA.label === 'subject' ? bodyA : bodyB;
                    
                    if (subject.speed > 3.0) {
                        sound.playClatter(subject.speed);
                    }

                    // Terminal speed impact against floor/border
                    if (subject.speed > 9.5 && !subject.isSpawnProtected) {
                        const blockData = activeBlocks.find(b => b.body === subject);
                        if (blockData && !subject.isDestroyed) { 
                            shatterIntoShardsAndPowder(blockData, subject.velocity.x, subject.velocity.y, 1.2); 
                            triggerDirectionalShake(subject.velocity.x, subject.velocity.y, 8); 
                            triggerHaptic(25);
                        }
                    }
                }

                // Shards bouncing against boundaries
                if (bodyA.label === 'shard' || bodyB.label === 'shard') {
                    const shard = bodyA.label === 'shard' ? bodyA : bodyB;
                    if (shard.speed > 3.0) {
                        sound.playClatter(shard.speed * 0.7);
                    }
                }
            }
        });

        // ==========================================
        // 7. POINTER VELOCITY & INTERACTION LISTENERS
        // ==========================================
        function updatePointerVelocity(x, y) {
            const now = performance.now();
            const dt = Math.max((now - lastPointerTime) / 1000, 0.001);
            pointerVx = (x - lastPointerX) / dt * 0.05;
            pointerVy = (y - lastPointerY) / dt * 0.05;
            lastPointerX = x;
            lastPointerY = y;
            lastPointerTime = now;
        }

        // Desktop Mouse Listeners
        gameContainer.addEventListener('mousemove', (e) => {
            const rect = gameContainer.getBoundingClientRect(); 
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;
            updatePointerVelocity(px, py);

            if (currentMode === 'bat') {
                positionBat(px, py);
            }
        });

        gameContainer.addEventListener('mousedown', (e) => {
            if (e.target.closest('#ui-layer') || e.target.closest('#btn-show-ui')) return; 
            if (currentMode !== 'bat') return;
            executeBatSwing(mouseX, mouseY, false);
        });

        // Mobile / Touchscreen Listeners
        let lastTouchX = 0, lastTouchY = 0;
        let lastSwipeTime = 0;

        gameContainer.addEventListener('touchstart', (e) => {
            if (e.target.closest('#ui-layer') || e.target.closest('#btn-show-ui')) return;
            if (e.touches.length === 0) return;

            const rect = gameContainer.getBoundingClientRect();
            const touch = e.touches[0];
            const tx = touch.clientX - rect.left;
            const ty = touch.clientY - rect.top;
            lastTouchX = tx;
            lastTouchY = ty;
            lastPointerX = tx;
            lastPointerY = ty;
            lastPointerTime = performance.now();

            if (currentMode === 'bat') {
                e.preventDefault(); 
                positionBat(tx, ty);
                executeBatSwing(tx, ty, true);
            }
        }, { passive: false });

        gameContainer.addEventListener('touchmove', (e) => {
            if (e.target.closest('#ui-layer') || e.target.closest('#btn-show-ui')) return;
            if (e.touches.length === 0) return;

            const rect = gameContainer.getBoundingClientRect();
            const touch = e.touches[0];
            const tx = touch.clientX - rect.left;
            const ty = touch.clientY - rect.top;

            updatePointerVelocity(tx, ty);

            if (currentMode === 'bat') {
                e.preventDefault(); 
                positionBat(tx, ty);

                const dx = tx - lastTouchX;
                const dy = ty - lastTouchY;
                const distMoved = Math.sqrt(dx * dx + dy * dy);
                const now = Date.now();

                // Fast swipe detection
                if (distMoved > 22 && (now - lastSwipeTime > 110)) {
                    lastSwipeTime = now;
                    executeBatSwing(tx, ty, true);
                }

                lastTouchX = tx;
                lastTouchY = ty;
            }
        }, { passive: false });

        gameContainer.addEventListener('touchend', (e) => {
            if (currentMode === 'bat') {
                setTimeout(() => { batUI.classList.remove('swinging'); }, 120);
            }
        });

        // ==========================================
        // 8. RENDER SYNCHRONIZATION WITH 3D TILT
        // ==========================================
        Events.on(engine, 'afterUpdate', function() {
            // Update Active Subject Blocks with 3D Perspective Tilt & Elastic Squash
            activeBlocks.forEach(b => { 
                if (!b.body.isDestroyed) { 
                    b.element.style.left = (b.body.position.x - b.width / 2) + 'px'; 
                    b.element.style.top = (b.body.position.y - b.height / 2) + 'px'; 
                    
                    // Dynamic 3D rotational tilt based on velocity vector
                    const tiltX = Math.max(-20, Math.min(20, -b.body.velocity.y * 1.3));
                    const tiltY = Math.max(-20, Math.min(20, b.body.velocity.x * 1.3));
                    
                    // Elastic squash & stretch handling
                    let scaleX = 1.0, scaleY = 1.0;
                    if (b.squashTimer > 0) {
                        scaleX = 1.15;
                        scaleY = 0.85;
                        b.squashTimer--;
                    }

                    b.element.style.transform = `perspective(600px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) rotateZ(${b.body.angle}rad) scale(${scaleX}, ${scaleY})`; 
                }
            });

            // Update Physical Shards with tumbling rotation
            physicalShards.forEach(s => {
                if (s.element.parentElement) {
                    s.element.style.left = (s.body.position.x - s.width / 2) + 'px';
                    s.element.style.top = (s.body.position.y - s.height / 2) + 'px';
                    s.element.style.transform = `rotate(${s.body.angle}rad)`;
                }
            });

            // Update Powder Debris Particles
            debrisBlocks.forEach(d => { 
                if (d.element.parentElement) { 
                    d.element.style.left = (d.body.position.x - d.width / 2) + 'px'; 
                    d.element.style.top = (d.body.position.y - d.height / 2) + 'px'; 
                    d.element.style.transform = `rotate(${d.body.angle}rad)`; 
                }
            });
        });

        Runner.run(Runner.create(), engine);
    </script>
</body>
